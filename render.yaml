# Render Blueprint for the CV Analyzer FastAPI backend.
# In Render: New + → Blueprint → connect this repo → it reads this file.
services:
  - type: web
    name: cv-analyzer-api
    runtime: python
    rootDir: CV/backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Set to your deployed frontend URL after Vercel deploy (comma-separated for multiple).
      - key: ALLOWED_ORIGINS
        sync: false
      # OPTIONAL: with no key the app runs in deterministic/mock mode (still functional).
      - key: OPENAI_API_KEY
        sync: false
      - key: MODEL_NAME
        value: gpt-4o-mini
